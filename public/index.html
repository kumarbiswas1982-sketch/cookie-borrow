  if(a==='labmix'){
    const key=L.sel.slice().sort().join('+'),r=MIXES[key];if(!r)return true;
    L.done[key]=1;L.show={a:L.sel[0],col:r[1],name:r[0],parts:L.sel.map(x=>x[0].toUpperCase()+x.slice(1)).join(' and ')};L.say=`${L.show.parts} makes ${r[0]}!`;L.sel=[];L.mood='cheer';snd.yes();
    labRefresh();return true;
  }
  if(a==='labdone'){L.step='result';L.say='What did you find out?';L.mood='happy';snd.yes();labRefresh();window.scrollTo(0,0);return true}
  if(a==='labtocheck'){L.step='check';L.say='One quick question to finish!';L.mood='think';snd.tap();labRefresh();window.scrollTo(0,0);return true}
  if(a==='labcheck'){
    const k=+b.dataset.k,c=LABD[L.id].check;
    if(k===c.ans){L.reward=labReward(L.id);L.step='done';L.say='Fantastic! You are a real scientist!';L.mood='cheer';snd.fan();labRefresh();window.scrollTo(0,0);rain()}
    else{L.wrong.push(k);L.mood='oops';snd.no();labRefresh()}
    return true;
  }
  return false;
}
document.addEventListener('input',e=>{
  const t=e.target;if(!t||t.id!=='labrange'||!S.lab||S.view!=='lab')return;
  const L=S.lab;
  if(t.dataset.lab==='melt'){
    L.t=+t.value;if(L.t>=28)L.seen[L.place]=true;
    const st=document.getElementById('meltst'),v=document.getElementById('meltv');
    if(st)st.innerHTML=meltStage(L);
    if(v)v.innerHTML=`<b>${L.t}</b> minutes passed. Ice left: <b>${Math.round((1-meltF(L.place,L.t))*100)}%</b>`;
    if(L.t>=28&&Object.keys(MELT).every(k=>L.seen[k])){const bd=document.getElementById('labbody');if(bd){const y=window.scrollY;bd.innerHTML=labBody(L);window.scrollTo(0,y);const r=document.getElementById('labrange');if(r)r.value=L.t}}
  }else if(t.dataset.lab==='shadow'){
    L.p=+t.value;const g=shadowGeom(L.p);
    if(L.p<25)L.seen.morn=true;if(L.p>=40&&L.p<=60)L.seen.mid=true;if(L.p>75)L.seen.aft=true;
    const st=document.getElementById('shst'),v=document.getElementById('shv'),tk=document.getElementById('shtick');
    const c=x=>x?'✓':'○';
    if(st)st.innerHTML=shadowStage(L);
    if(v)v.innerHTML=`<b>${fmtHour(g.hour)}</b> · Shadow length: <b>${g.len<30?'short':g.len<80?'medium':'long'}</b>`;
    if(tk)tk.innerHTML=`${c(L.seen.morn)} Morning &nbsp; ${c(L.seen.mid)} Middle of the day &nbsp; ${c(L.seen.aft)} Afternoon`;
    if(L.seen.morn&&L.seen.mid&&L.seen.aft){const d=document.querySelector('[data-act="labdone"]');if(d&&d.disabled){const y=window.scrollY;document.getElementById('labbody').innerHTML=labBody(L);window.scrollTo(0,y);const r=document.getElementById('labrange');if(r)r.value=L.p}}
  }
});


/* ======================= account and sync (Vercel version) ======================= */
const ACCOUNT_NAME='Srimaa Biswas';
const freshSave=()=>Object.assign(DEFAULTS(),{coins:100,gift:1,updated:Date.now()});
function saveSync(){try{localStorage.setItem('y2m-sync',JSON.stringify(SYNC))}catch(e){}}
function ensureProf(){PROF.list=[{id:'p1',name:ACCOUNT_NAME}];PROF.active='p1';persistProf()}
async function api(path,opt){
  opt=opt||{};
  const h={'content-type':'application/json'};if(AUTH)h.authorization='Bearer '+AUTH.token;
  const r=await fetch('/api/'+path,{method:opt.body?'POST':'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&AUTH&&path!=='login'&&path!=='status'){
    AUTH=null;try{localStorage.removeItem('y2m-auth')}catch(e){}
    S.auth={mode:'login',msg:'Please log in again to keep saving.'};S.view='login';render();
  }
  return {ok:r.ok,status:r.status,j};
}
const syncText=()=>!AUTH?'':S.sync==='saving'?'Saving...':S.sync==='error'?'No internet right now. Progress is kept here and will save when it is back.':SYNC.dirty?'Saving soon...':'Saved to the account ✓';
function updateSyncUI(){document.querySelectorAll('.syncst').forEach(e=>{e.textContent=syncText()})}
function markDirty(){
  if(!AUTH)return;
  SYNC.dirty=true;saveSync();clearTimeout(SYNC_T);SYNC_T=setTimeout(syncPush,1500);
}
let SYNC_T=0,SYNC_BUSY=false;
function adoptServer(data){
  Object.keys(SAVE).forEach(k=>delete SAVE[k]);
  Object.assign(SAVE,DEFAULTS(),data);
  if(SAVE.coins==null)SAVE.coins=SAVE.stars;
  try{localStorage.setItem(keyFor('p1'),JSON.stringify(SAVE));localStorage.setItem('y2m-sync-base',JSON.stringify(data))}catch(e){}
  ensureProf();applyPrefs();touchWeek();
  if(S.view==='home'||S.view==='burrow')render();
}
async function syncPush(){
  if(!AUTH||SYNC_BUSY||!SYNC.dirty)return true;
  SYNC_BUSY=true;S.sync='saving';updateSyncUI();
  let ok=false;
  try{
    const u=SAVE.updated,copy=JSON.parse(JSON.stringify(SAVE));
    const r=await api('data',{body:{base:SYNC.ver,data:copy,baseData:readJ('y2m-sync-base')}});
    if(r.ok){
      SYNC.ver=r.j.ver;
      if(r.j.merged&&r.j.data){adoptServer(r.j.data);SYNC.dirty=false}
      else{SYNC.dirty=SAVE.updated!==u;try{localStorage.setItem('y2m-sync-base',JSON.stringify(copy))}catch(e){}}
      S.sync='ok';ok=true;
    }else S.sync=r.status===401?'ok':'error';
  }catch(e){S.sync='error'}
  SYNC_BUSY=false;saveSync();updateSyncUI();
  if(SYNC.dirty&&AUTH){clearTimeout(SYNC_T);SYNC_T=setTimeout(syncPush,S.sync==='error'?15000:1500)}
  return ok;
}
async function syncPull(){
  if(!AUTH||SYNC_BUSY)return;
  if(SYNC.dirty)return syncPush();
  try{
    const r=await api('data?ver='+SYNC.ver);
    if(r.ok&&!r.j.same&&r.j.data&&r.j.ver!==SYNC.ver){adoptServer(r.j.data);SYNC.ver=r.j.ver;saveSync()}
    if(r.ok)S.sync='ok';
  }catch(e){S.sync='error'}
  updateSyncUI();
}
function loading(){
  $v.innerHTML=`<div class="qhead">${mascotBtn('happy','big bounce',false)}${bubble(S.loadErr?'I could not reach the internet.':'One moment, I am finding your progress...')}</div>
  <section class="card"><h2>${S.loadErr?'Cannot load yet':'Loading'}</h2><p>${S.loadErr?esc(S.loadErr):'Getting Srimaa’s carrots and stickers.'}</p>${S.loadErr?'<div class="actions"><button class="btn" data-act="retryload">Try again</button></div>':''}</section>`;
}
async function bootLoad(){
  S.view='loading';S.loadErr='';render();
  try{
    const r=await api('data');
    if(r.ok&&r.j.data){adoptServer(r.j.data);SYNC.ver=r.j.ver;SYNC.dirty=false;saveSync();S.view='home';render();return}
    if(r.ok){const d=freshSave();adoptServer(d);SYNC.dirty=true;saveSync();S.view='home';render();syncPush();return}
    if(S.view==='loading'){S.loadErr=(r.j&&r.j.error)||'Please try again.';render()}
  }catch(e){S.loadErr='Check the internet connection and try again.';render()}
}
function login(){
  const A=S.auth||(S.auth={mode:null,msg:''});
  if(A.mode===null){
    A.mode='checking';
    api('status').then(r=>{
      if(r.ok){A.mode=r.j.setup?'login':'setup';A.needCode=!!r.j.needCode}
      else{A.mode='login';A.msg='Cannot reach the server. Check the internet connection.'}
      if(S.view==='login')render();
    }).catch(()=>{A.mode='login';A.msg='Cannot reach the server. Check the internet connection.';if(S.view==='login')render()});
  }
  if(A.mode==='checking'){$v.innerHTML=`<div class="qhead">${mascotBtn('happy','big bounce',false)}${bubble('Hi hi! One moment...')}</div>`;return}
  const setup=A.mode==='setup';
  $v.innerHTML=`<div class="qhead">${mascotBtn('cheer','big bounce',false)}${bubble(setup?'Hi hi! Let us make Srimaa’s account. She gets a gift of 100 carrots!':'Welcome back! Log in to find your carrots and stickers.')}</div>
  <section class="card"><h2>${setup?'Create Srimaa’s account':'Log in'}</h2>
  <p class="sub">${setup?'A grown-up does this once. Then every iPad, phone or computer logs in with the same email and password, and the progress follows Srimaa everywhere.':'Use the family email and password.'}</p>
  <form class="addp" data-form="${setup?'setup':'login'}">
    <label for="em">Email</label><div class="addrow"><input id="em" name="email" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" required></div>
    <label for="pw">${setup?'Choose a password (8 or more characters)':'Password'}</label><div class="addrow"><input id="pw" name="pw" type="password" autocomplete="${setup?'new-password':'current-password'}" minlength="${setup?8:1}" required></div>
    ${setup&&A.needCode?'<label for="sc">Setup code</label><div class="addrow"><input id="sc" name="code" type="password" autocomplete="off" autocapitalize="off" required></div>':''}
    <div class="actions"><button class="btn" type="submit"${A.busy?' disabled':''}>${A.busy?'Please wait...':setup?'Create account':'Log in'}</button></div>
  </form>
  <p class="sub" id="authmsg" role="status">${esc(A.msg||'')}</p></section>`;
}
async function doAuth(kind,form){
  const A=S.auth||(S.auth={mode:kind,msg:''});if(A.busy)return;
  const email=form.querySelector('[name=email]').value.trim(),pw=form.querySelector('[name=pw]').value,code=(form.querySelector('[name=code]')||{}).value||'';
  A.busy=true;A.msg='';render();
  let r;
  try{
    const gift=freshSave();
    r=kind==='setup'?await api('setup',{body:{email,password:pw,code,data:gift}}):await api('login',{body:{email,password:pw}});
    if(r.ok){
      AUTH={token:r.j.token,email};try{localStorage.setItem('y2m-auth',JSON.stringify(AUTH))}catch(e){}
      A.busy=false;
      if(kind==='setup'){
        adoptServer(gift);SYNC={ver:r.j.ver,dirty:false};saveSync();
        S.view='home';S.homeLine='Welcome, Srimaa! Your gift is 100 carrots. Visit my burrow to spend them!';S.auth=null;render();window.scrollTo(0,0);snd.fan();rain();return;
      }
      S.auth=null;
      const local=readJ(keyFor('p1'));
      if(SYNC.dirty&&local&&local.stars){ensureProf();loadProfile('p1');S.view='home';render();await syncPush();await syncPull();return}
      await bootLoad();return;
    }
    A.msg=(r.j&&r.j.error)||'Something went wrong. Please try again.';
  }catch(e){A.msg='Cannot reach the server. Check the internet connection.'}
  A.busy=false;S.view='login';render();
}
async function doLogout(){
  const ok=await syncPush();
  if(!ok&&SYNC.dirty){S.restoreAsk='';const m=document.getElementById('acctmsg');if(m)m.textContent='Could not save to the account first, so you are still logged in. Check the internet and try again.';return}
  try{Object.keys(localStorage).filter(k=>k.startsWith('y2m-')).forEach(k=>localStorage.removeItem(k))}catch(e){}
  AUTH=null;SYNC={ver:0,dirty:false};PROF={active:'',list:[]};
  Object.keys(SAVE).forEach(k=>delete SAVE[k]);Object.assign(SAVE,DEFAULTS());
  S.auth=null;S.restoreAsk='';S.gateOk=false;S.view='login';render();window.scrollTo(0,0);
}
function accountHtml(){
  if(!AUTH)return '';
  const snaps=(S.snaps||[]).map(s=>`<button class="btn small alt" data-act="snaprestore" data-n="${s.n}">${S.restoreAsk==='snap'+s.n?'Tap again to restore':fmtDate(dayStr(new Date(s.day*864e5+864e5/2+new Date().getTimezoneOffset()*6e4)))+' · '+s.stars+' stars · '+s.carrots+' carrots'}</button>`).join('');
  return `<div class="noprint"><h3>Account and sync</h3>
  <p>Signed in as <b>${esc(AUTH.email)}</b>. <span class="syncst">${syncText()}</span></p>
  <div class="actions"><button class="btn small" data-act="syncnow">Sync now</button><button class="btn small alt" data-act="logout">${S.restoreAsk==='logout'?'Tap again to log out':'Log out of this device'}</button></div>
  <p class="sub" id="acctmsg" role="status"></p>
  ${snaps?`<p class="sub"><b>Safety copies kept on the server (one a day for a week):</b></p><div class="chipsrow">${snaps}</div>`:''}</div>`;
}
function accountAct(a,b){
  if(a==='syncnow'){SYNC.dirty=true;saveSync();syncPush().then(()=>syncPull());snd.tap();return true}
  if(a==='retryload'){bootLoad();return true}
  if(a==='logout'){
    if(S.restoreAsk!=='logout'){S.restoreAsk='logout';snd.tap();const y=window.scrollY;render();window.scrollTo(0,y);return true}
    doLogout();return true;
  }
  if(a==='snaprestore'){
    const n=+b.dataset.n;
    if(S.restoreAsk!=='snap'+n){S.restoreAsk='snap'+n;snd.tap();const y=window.scrollY;render();window.scrollTo(0,y);return true}
    api('snaps',{body:{n}}).then(r=>{
      if(r.ok){adoptServer(r.j.data);SYNC.ver=r.j.ver;SYNC.dirty=false;saveSync();S.restoreAsk='';S.view='home';render();snd.yes()}
      else{const m=document.getElementById('acctmsg');if(m)m.textContent=(r.j&&r.j.error)||'That did not work.'}
    });
    return true;
  }
  return false;
}
function reportFetchSnaps(){
  if(!AUTH||(S.snapsAt&&Date.now()-S.snapsAt<20000))return;
  S.snapsAt=Date.now();
  api('snaps').then(r=>{if(r.ok){S.snaps=r.j.snaps;if(S.view==='report')render()}}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull();else if(SYNC.dirty)syncPush()});
window.addEventListener('online',()=>syncPush());
setInterval(()=>{if(!document.hidden)syncPull()},45000);
S.sync='ok';
if(AUTH&&!PROF.active)bootLoad();
else if(AUTH){syncPull()}

render();
</script>
