<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cookie's Learning Burrow</title>
<meta name="description" content="Cookie's Learning Burrow: Year 2 maths, English and science with times tables, games and rewards.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookie's Burrow"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFD9EC">
<link rel="apple-touch-icon" href="/icon-180.png"><link rel="icon" type="image/png" href="/icon-180.png"><link rel="manifest" href="/manifest.webmanifest">
<style>html,body{margin:0}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: sunny Australian-bush play screen. Thick ink outlines and hard offset shadows make every tappable thing look like a chunky sticker.
   Deliberately one bright look (no dark mode): a kids' game on an iPad. */
:root{
  color-scheme:light;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ink:#22304A; --muted:#51617D; --paper:#FFFFFF; --cream:#FFF9EA; --sky:#FFD9EC;
  --sun:#FFC933; --sun-soft:#FFF0B3; --gum:#2DBE7B; --gum-soft:#BDF0D6; --coral:#FF6B5E; --coral-soft:#FFC9C2;
  --grape:#8A63F2; --pink:#FF78AD; --blue:#3FA7F5; --line:#D5E0EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:#FFD9EC;color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.45;padding-inline:16px;padding-block:0 90px;touch-action:manipulation;-webkit-touch-callout:none;min-height:100%}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* scenery */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#F6B6D9 0,#FFD9EC 48%,#FFF3F9 100%)}
.sunball{position:absolute;right:6%;top:84px;width:92px;height:92px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 14px rgba(255,201,51,.35),0 0 0 30px rgba(255,201,51,.18)}
.cloud{position:absolute;height:34px;width:120px;background:#fff;border-radius:40px;opacity:.9;animation:drift 70s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;left:18px;top:-24px}
.cloud::after{width:38px;height:38px;left:60px;top:-16px}
.c1{top:150px;left:-160px}
.c2{top:280px;left:-160px;animation-duration:95s;animation-delay:-40s;transform:scale(.8)}
.hills{position:absolute;left:0;bottom:0;width:100%;height:120px}
@keyframes drift{to{transform:translateX(calc(100vw + 360px))}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px;max-width:1000px;margin-inline:auto}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:2px 14px;box-shadow:0 4px 0 var(--ink)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:48px;min-width:48px;justify-content:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:2px 12px;box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
button.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.hot{background:var(--coral-soft)}
.ic{width:26px;height:26px;flex:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ic.f-sun{fill:var(--sun)}.ic.f-coral{fill:var(--coral)}.ic.f-ink{fill:var(--ink)}

.wrap{position:relative;z-index:1;max-width:1000px;margin-inline:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gum);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 26px;min-height:64px;box-shadow:0 6px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:1.5rem}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper)}
.btn.sun{background:var(--sun)}
.btn.small{min-height:52px;font-size:1.2rem;padding:6px 18px;box-shadow:0 5px 0 var(--ink)}

/* mascot + bubble */
.qhead{display:flex;align-items:center;gap:14px}
.mascot{flex:none;width:130px;background:none;border:0;padding:0;display:block;animation:idle 3.2s ease-in-out infinite}
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
.mascot.bounce{animation:bounce .9s ease both}
.mascot.shake{animation:shake .7s ease both}
.mascot.big{width:170px}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.25;box-shadow:0 5px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;width:22px;height:22px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-50%) rotate(45deg);border-bottom-left-radius:6px}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bounce{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-34px) scale(1.06,.94) rotate(-5deg)}50%{transform:translateY(0) scale(.96,1.04)}70%{transform:translateY(-18px) rotate(5deg)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px) rotate(-6deg)}35%{transform:translateX(12px) rotate(6deg)}55%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* home */
.hero{margin-bottom:20px}
.rank{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.rank h2{font-size:1.5rem}
.meter{height:20px;border-radius:99px;border:3px solid var(--ink);background:var(--cream);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-right:3px solid var(--ink);min-width:6px}
.rank p{color:var(--muted);font-size:.95rem}
.mix{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sun);border:3px solid var(--ink);border-radius:24px;padding:16px 20px;box-shadow:0 7px 0 var(--ink);margin-bottom:28px}
.mix h2{font-size:1.9rem}
.mix p{font-size:1rem}
.sec{font-size:1.6rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;background:var(--tc);border:3px solid var(--ink);border-radius:24px;padding:14px;min-height:112px;box-shadow:0 7px 0 var(--ink);min-width:0}
.tile:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.glyph{flex:none;width:68px;height:68px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.15rem;white-space:nowrap}
.tt{display:flex;flex-direction:column;min-width:0;gap:2px}
.tt strong{font-family:var(--display);font-size:1.4rem;line-height:1.1}
.tt .ds{font-size:.9rem;line-height:1.25}
.tstars{display:flex;gap:2px;margin-top:2px}
.tstars .ic{width:22px;height:22px;stroke-width:2;fill:rgba(255,255,255,.7)}
.tstars .ic.on{fill:var(--sun)}
.foot{margin-top:30px;font-size:.9rem;color:var(--muted);max-width:60ch}

/* quiz */
.pips{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px}
.pips li{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.75);border:3px solid var(--ink)}
.pips li.right{background:var(--gum)}
.pips li.wrong{background:var(--coral)}
.pips li.cur{background:var(--sun)}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:28px;padding:20px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:18px;margin-top:16px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--display);font-weight:700;color:var(--muted);font-size:1.05rem;font-variant-numeric:tabular-nums}
.q{font-size:clamp(1.7rem,3.8vw,2.5rem);font-weight:800;line-height:1.2}
.vis{display:flex;flex-wrap:wrap;gap:14px;align-items:center;min-width:0;background:var(--paper);border:3px dashed var(--line);border-radius:20px;padding:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.opt{--oc:#CFE9FF;position:relative;background:var(--oc);border:3px solid var(--ink);border-radius:20px;padding:14px;min-height:84px;box-shadow:0 6px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;text-wrap:balance}
.opt:nth-child(4n+2){--oc:#FFD6E8}.opt:nth-child(4n+3){--oc:#FFF0B3}.opt:nth-child(4n+4){--oc:#CFF5E3}
.opt:not(:disabled):active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt.right{background:var(--gum-soft);animation:pop .5s ease}
.opt.wrong{background:var(--coral-soft);animation:shake .5s ease}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.numwrap{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.ansrow{display:flex;align-items:center;gap:12px;min-width:0}
.ansbox{min-width:8.5rem;height:84px;display:grid;place-items:center;padding:0 22px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;font-family:var(--display);font-weight:800;font-size:3rem;font-variant-numeric:tabular-nums;box-shadow:inset 0 4px 0 rgba(34,48,74,.12)}
.ansbox.empty{color:#B3C0D3;animation:blink 1.1s steps(2) infinite}
.ansbox.right{background:var(--gum-soft)}
.ansbox.wrong{background:var(--coral-soft)}
.unit{font-family:var(--display);font-weight:800;font-size:1.6rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,390px)}
.key{min-height:76px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:2.2rem;display:grid;place-items:center}
.key:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.key.back{background:var(--coral-soft)}
.key.go{background:var(--gum)}
.key:disabled{opacity:.45;box-shadow:0 6px 0 var(--ink)}
@keyframes blink{50%{opacity:.4}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.fb{border:3px solid var(--ink);border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--gum-soft)}
.fb.no{background:var(--coral-soft)}
.fb.hint{background:var(--sun-soft)}
.fbtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:800;font-size:1.5rem}
.gain{display:inline-flex;align-items:center;gap:4px;background:var(--sun);border:3px solid var(--ink);border-radius:99px;padding:0 12px;font-size:1.2rem;animation:pop .6s ease}
.how{font-size:1.1rem}
.actions{display:flex;gap:12px;flex-wrap:wrap}

/* visuals */
.seq{display:flex;gap:10px;flex-wrap:wrap}
.cell{min-width:68px;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;background:#CFE9FF;font-family:var(--display);font-weight:800;font-size:1.9rem;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--ink)}
.cell:nth-child(2n){background:#FFD6E8}
.cell.blank{background:var(--sun);animation:blink 1.1s steps(2) infinite}
.dot{display:block;width:20px;height:20px;border-radius:50%;background:var(--dc,var(--blue));border:2.5px solid var(--ink)}
.groups{display:flex;gap:14px;flex-wrap:wrap}
.grp{display:grid;grid-template-columns:repeat(var(--c),20px);gap:7px;padding:10px;border:3px dashed var(--ink);border-radius:16px;background:var(--cream)}
.array{display:grid;grid-template-columns:repeat(var(--c),20px);gap:9px;padding:6px}
.pile{display:flex;flex-wrap:wrap;gap:7px;max-width:340px}
.pg{width:100%;display:flex;flex-direction:column;gap:6px}
.pgt{font-family:var(--display);font-weight:700;font-size:1.15rem}
.prow{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--line);padding-block:6px}
.pl{width:6.6rem;flex:none;font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.pie,.poly{width:170px;max-width:100%;height:auto}
.slice{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.slice.on{fill:var(--sun)}
.shape{fill:#BDE7FF;stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.clock{width:min(260px,70vw);height:auto}
.face{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.cn{font:800 11px var(--display);fill:var(--ink)}
.hh{stroke:var(--ink);stroke-width:5.5;stroke-linecap:round}
.mh{stroke:var(--coral);stroke-width:4;stroke-linecap:round}
.pin{fill:var(--ink)}
.digital{display:inline-block;font:800 3.4rem/1.1 var(--display);background:var(--ink);color:#B8FFD8;padding:6px 22px;border-radius:16px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ruler{width:100%;max-width:480px;height:auto}
.objbar{fill:var(--sun);stroke:var(--ink);stroke-width:1.5}
.rul{fill:#FFF6D6;stroke:var(--ink);stroke-width:1.5}
.tick{stroke:var(--ink);stroke-width:1.2}
.rn{font:800 9px var(--display);fill:var(--ink);text-anchor:middle}
.money{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.coin{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--display);font-weight:800;font-size:.9rem;color:#1A2430;border:2.5px solid var(--ink)}
.coin.s{background:#D5DEE6}
.coin.g{background:#F2C14E}
.note{display:grid;place-items:center;width:124px;height:62px;border-radius:8px;border:3px solid var(--ink);font-family:var(--display);font-weight:800;font-size:1.5rem;color:#1A2430}
.note.n5{background:#E4C4F0}.note.n10{background:#A6C9F2}.note.n20{background:#F5A590}

/* results, stickers */
.res{gap:20px}
.scorebig{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:5.4rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:2rem;color:var(--muted)}
.stars{display:flex;gap:8px}
.stars .ic{width:56px;height:56px;stroke-width:2;fill:var(--paper)}
.stars .ic.on{fill:var(--sun);animation:pop .6s ease both}
.earn{display:inline-flex;align-items:center;gap:6px;background:var(--sun-soft);border:3px solid var(--ink);border-radius:16px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:1.3rem;width:fit-content}
.reward{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#E9E0FF;border:3px solid var(--ink);border-radius:24px;padding:16px}
.reward h3{font-size:1.7rem}
.reward p{font-size:1.2rem;margin-bottom:8px}
.sticker{display:block;width:130px;background:var(--paper);border:5px solid #fff;border-radius:26px;box-shadow:0 0 0 3px var(--ink),0 8px 0 3px var(--ink);transform:rotate(var(--rot,-3deg));padding:6px}
.sticker svg{width:100%;height:auto;display:block}
.sticker.pop{animation:stick .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stick{0%{transform:scale(2.4) rotate(18deg);opacity:0}100%{transform:scale(1) rotate(var(--rot,-3deg));opacity:1}}
.rankup{background:var(--sun);border:3px solid var(--ink);border-radius:20px;padding:12px 18px;font-family:var(--display);font-weight:800;font-size:1.4rem}
.joke{background:#CFF5E3;border:3px solid var(--ink);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.joke h3{font-size:1.3rem}
.joke .su{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.25}
.joke .pu{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.2;animation:pop .5s ease}
.rev{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rev li{border:3px solid var(--ink);border-radius:16px;padding:10px 14px;background:var(--paper)}
.rev b{color:#C0392B}
.sub{color:var(--muted);font-size:1.05rem}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.slot{background:none;border:0;padding:6px;display:flex;flex-direction:column;align-items:center;gap:12px}
.slot .sticker{width:100%;max-width:150px}
.slot.lock .sticker svg{filter:brightness(0) opacity(.16)}
.slot .sn{font-family:var(--display);font-weight:800;font-size:1.15rem;text-align:center;line-height:1.1}
.slot.wig{animation:shake .6s ease}
.slot.own.wig .sticker{animation:pop .6s ease}
.cf{position:fixed;pointer-events:none;z-index:50;will-change:transform}
.daily{display:flex;align-items:center;gap:8px;color:var(--ink)!important;font-weight:700}
.link{background:none;border:0;padding:6px 2px;color:#4B2FBF;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.ttbox{background:var(--grape);color:#fff;border:3px solid var(--ink);border-radius:28px;padding:18px 20px 22px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.ttbox h2{font-size:2rem;color:#fff;text-shadow:0 3px 0 var(--ink)}
.ttbox>p{font-size:1.1rem}
.ttgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ttbtn{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px}
.ttbtn b{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1}
.ttbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.ms{display:flex;gap:3px}
.ms i{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:#E3EAF3}
.ms i.on{background:var(--sun)}
.ttbtn.s3{background:var(--sun-soft)}
.y3h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.lvl{font-family:var(--body);font-size:.95rem;font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:0 12px}
.trick{background:var(--sun-soft);border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-size:1.15rem}
.lrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lrow{font-family:var(--display);font-weight:800;font-size:1.5rem;background:var(--paper);border:3px solid var(--ink);border-radius:16px;min-height:64px;box-shadow:0 5px 0 var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:6px}
.lrow:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lrow.sel{background:var(--sun)}
.lrow.hot{background:var(--gum-soft);animation:pop .4s ease}
.array.sm{grid-template-columns:repeat(var(--c),14px);gap:5px}
.array.sm .dot{width:14px;height:14px;border-width:2px}
.skipline{font-family:var(--display);font-weight:700;font-size:1.2rem;overflow-wrap:anywhere}
.rep{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr auto;gap:12px;align-items:center}
.rbar{height:20px;border:3px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.rbar i{display:block;height:100%;border-right:3px solid var(--ink)}
.rbar i.g{background:var(--gum)}.rbar i.y{background:var(--sun)}.rbar i.r{background:var(--coral)}
.rlab{font-weight:700;font-size:.95rem;white-space:nowrap}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap}

<script>
'use strict';
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=R(0,i);[x[i],x[j]]=[x[j],x[i]]}return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACTORS=['Cookie the bunny','Pippin the bunny','Daisy the bunny','Biscuit the bunny','Nibbles the bunny','Poppy the bunny','Hazel the bunny','Maple the bunny','Toffee the bunny','Peanut the bunny'];
const THINGS=['carrots','lettuce leaves','clover flowers','dandelions','strawberries','blueberries','carrot cupcakes','fluffy pom-poms','golden eggs','spotty socks'];
const THIEVES=['a cheeky fox','a sneaky crow','a hungry magpie','a naughty possum','a silly galah'];

/* ---------- question builders ---------- */
let NEXTPIC='';
const takePic=()=>{const p=NEXTPIC;NEXTPIC='';return p};
const num=(q,a,hint,why,o={})=>({kind:'num',q,answer:a,hint,why,dec:!!o.dec,vis:o.vis||'',unit:o.unit||'',show:a+(o.unit?' '+o.unit:''),pic:takePic()});
const choice=(q,options,answer,hint,why,vis='')=>({kind:'choice',q,options,answer,hint,why,vis,show:options.find(o=>o.value===answer).label,pic:takePic()});
function nchoices(correct,ds,fmt=String,deltas=[-10,-2,-1,1,2,10]){
  const set=[];const add=v=>{if(v>=0&&v!==correct&&!set.includes(v))set.push(v)};
  shuffle(ds).forEach(add);
  let t=0;while(set.length<3&&t++<80)add(correct+pick(deltas));
  let k=1;while(set.length<3)add(correct+100*k++);
  return shuffle([correct,...set.slice(0,3)]).map(v=>({label:fmt(v),value:v}));
}
function tchoices(correct,ds){
  const set=[...new Set(ds.filter(d=>d!==correct))];
  return shuffle([correct,...shuffle(set).slice(0,3)]).map(v=>({label:v,value:v}));
}
const DOTC=['#3FA7F5','#FF78AD','#2DBE7B','#FFC933','#8A63F2'];
const dots=(n,c)=>`<i class="dot"${c?` style="--dc:${c}"`:''}></i>`.repeat(n);
const arrayVis=(n,k)=>`<p class="pgt">Picture it: ${n} row${n>1?'s':''} of ${k} dots make ${n*k}.</p><div class="array sm" style="--c:${k}">${Array.from({length:n},(_,r)=>dots(k,DOTC[r%5])).join('')}</div>`;
const barModel=(total,parts)=>`<p class="pgt">Bar model: the parts add up to the whole.</p><div class="bar"><div class="bartot">${total}</div><div class="barparts">${parts.map((p,i)=>`<div class="barp" style="flex:${Math.max(p,1)};--bc:${DOTC[i%5]}">${p}</div>`).join('')}</div></div>`;

/* ---------- place value ---------- */
function gPlace(){
  const t=R(0,5);
  if(t===0){
    const h=R(1,9),te=R(0,9),o=R(0,9),n=h*100+te*10+o;
    return num(`What number is ${h} hundreds, ${te} tens and ${o} ones?`,n,'Say the hundreds first, then the tens, then the ones.',`${h*100} + ${te*10} + ${o} = ${n}.`);
  }
  if(t===1){
    const d=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,3),i=R(0,2),n=d[0]*100+d[1]*10+d[2],val=d[i]*[100,10,1][i],dg=d[i];
    return choice(`What is the value of the ${dg} in ${n}?`,nchoices(val,[dg*100,dg*10,dg]),val,'Which place is the digit in: hundreds, tens or ones?',`The ${dg} is in the ${['hundreds','tens','ones'][i]} place, so it is worth ${val}.`);
  }
  if(t===2){
    const k=pick([['10 more than',10],['10 less than',-10],['100 more than',100],['100 less than',-100]]),base=R(120,880),ans=base+k[1];
    return num(`What is ${k[0]} ${base}?`,ans,'Only one digit changes. Is it the tens or the hundreds?',`${base} ${k[1]>0?'+':'−'} ${Math.abs(k[1])} = ${ans}.`);
  }
  if(t===3){
    const h=R(1,9),set=new Set();while(set.size<4)set.add(h*100+R(0,99));
    const arr=[...set],big=pick([true,false]),ans=big?Math.max(...arr):Math.min(...arr);
    return choice(`Which number is the ${big?'greatest':'smallest'}?`,arr.map(v=>({label:v,value:v})),ans,'The hundreds digits match. Compare the tens, then the ones.',`${ans} is the ${big?'greatest':'smallest'} because of its tens and ones.`);
  }
  if(t===4){
    const n=R(11,99)*10;
    return num(`How many tens are in ${n}?`,n/10,'Think of groups of 10 that fit into the number.',`${n/10} groups of 10 make ${n}.`);
  }
  const h=R(1,9),te=R(1,9),o=R(1,9),n=h*100+te*10+o;
  return num(`${h*100} + ? + ${o} = ${n}. What is the missing number?`,te*10,'What is left after the hundreds and the ones?',`${h*100} + ${te*10} + ${o} = ${n}.`);
}

/* ---------- skip counting ---------- */
function gSkip(){
  const step=pick([2,3,5,10]),back=step!==3&&R(0,3)===0;
  const start=back?step*R(8,12):step*R(0,6);
  const seq=[...Array(5)].map((_,i)=>start+(back?-1:1)*step*i);
  const hide=R(1,3),ans=seq[hide];
  const vis='<div class="seq">'+seq.map((v,i)=>i===hide?'<span class="cell blank">?</span>':`<span class="cell">${v}</span>`).join('')+'</div>';
  return num(`Count ${back?'back':'on'} by ${step}s. What number goes in the box?`,ans,'Find the jump between two numbers that sit next to each other.',`The numbers go ${back?'down':'up'} by ${step} each time, so the missing number is ${ans}.`,{vis});
}

/* ---------- add and take away ---------- */
const addWhy=(a,b)=>{const t=b-b%10,o=b%10;if(!t)return `Count on ${o} from ${a}: ${a} + ${o} = ${a+b}.`;if(!o)return `${a} + ${t} = ${a+b}.`;return `Add the tens first: ${a} + ${t} = ${a+t}. Then add the ones: ${a+t} + ${o} = ${a+b}.`};
const subWhy=(a,b)=>{const t=b-b%10,o=b%10;if(!t)return `Count back ${o} from ${a}: ${a} − ${o} = ${a-b}.`;if(!o)return `${a} − ${t} = ${a-b}.`;return `Take away the tens first: ${a} − ${t} = ${a-t}. Then take away the ones: ${a-t} − ${o} = ${a-b}.`};
function gAddSub(){
  const t=R(0,7);
  if(t===0){const a=R(11,89),b=R(2,9);NEXTPIC=barModel(a+b,[a,b]);return num(`${a} + ${b} = ?`,a+b,'Count on from the bigger number.',addWhy(a,b))}
  if(t===1){const a=R(12,60),b=R(11,99-a);NEXTPIC=barModel(a+b,[a,b]);return num(`${a} + ${b} = ?`,a+b,'Add the tens first, then the ones.',addWhy(a,b))}
  if(t===2){const a=R(31,99),b=R(11,a-9);NEXTPIC=barModel(a,[b,a-b]);return num(`${a} − ${b} = ?`,a-b,'Take away the tens first, then the ones.',subWhy(a,b))}
  if(t===3){
    const a=R(5,30),b=R(5,30),f=R(0,2);NEXTPIC=barModel(a+b,[a,b]);
    if(f===0)return num(`${a} + ? = ${a+b}`,b,'Adding and taking away are opposites.',`${a+b} − ${a} = ${b}, so ${a} + ${b} = ${a+b}.`);
    if(f===1)return num(`? + ${b} = ${a+b}`,a,'Adding and taking away are opposites.',`${a+b} − ${b} = ${a}, so ${a} + ${b} = ${a+b}.`);
    return num(`${a+b} − ? = ${a}`,b,'How much must you take away to be left with the smaller number?',`${a+b} − ${b} = ${a}.`);
  }
  if(t===4){const n=R(6,35);return num(`What is double ${n}?`,2*n,'Double means the same number added again.',`${n} + ${n} = ${2*n}.`)}
  if(t===5){
    const n=pick(ACTORS),th=pick(THINGS),a=R(12,45),b=R(10,40);NEXTPIC=barModel(a+b,[a,b]);
    return num(`${n} has ${a} ${th}. A friendly bunny hops over and gives ${b} more. How many ${th} are there now?`,a+b,'Join the two groups together.',addWhy(a,b));
  }
  if(t===6){
    const n=pick(ACTORS),th=pick(THINGS),a=R(30,80),b=R(10,a-10);NEXTPIC=barModel(a,[b,a-b]);
    return num(`${n} has ${a} ${th}. Oh no! ${pick(THIEVES)} steals ${b} of them. How many are left?`,a-b,'Take the stolen ones away from the bigger group.',subWhy(a,b));
  }
  const a=R(3,17);NEXTPIC=barModel(20,[a,20-a]);return num(`What number goes with ${a} to make 20?`,20-a,`Count up from ${a} to 20.`,`${a} + ${20-a} = 20.`);
}

/* ---------- pull apart: take away by splitting the second number into tens and ones ---------- */
function pullNums(){
  const h=R(2,9),t1=R(1,9),o1=R(0,9),a=h*100+t1*10+o1,t2=R(1,t1),o2=R(1,9),b=t2*10+o2;
  return {a,b,t2,o2,T:t2*10,O:o2,mid:a-t2*10,ans:a-b};
}
const pullChip=(v,c)=>`<span class="pn${c?' '+c:''}">${v}</span>`;
const pullPic=n=>`<p class="pgt">Pull ${n.b} apart, then take away the tens and the ones one at a time.</p><div class="pull">${pullChip(n.b)}<span class="po">→</span>${pullChip(n.T,'t')}<span class="po">+</span>${pullChip(n.O,'o')}</div><p class="pgt">${n.a} − ${n.b} = ${n.a} − ${n.T} − ${n.O} = ${n.mid} − ${n.O} = ${n.ans}</p>`;
const pullWhy=n=>`Pull ${n.b} apart into ${n.T} and ${n.O}. First ${n.a} − ${n.T} = ${n.mid}. Then ${n.mid} − ${n.O} = ${n.ans}.`;
function gPull(){
  const n=pullNums(),r=R(0,9),t=r<3?0:r-2,{a,b,T,O,t2,mid,ans}=n;
  NEXTPIC=pullPic(n);
  if(t===0)return num(`${a} − ${b} = ?`,ans,`Pull ${b} apart into ${T} and ${O}. Take away the ${T} first, then the ${O}.`,pullWhy(n),{vis:`<div class="pull">${pullChip(a)}<span class="po">−</span>${pullChip(b)}</div>`});
  if(t===1)return num(`Pull ${b} apart: ${a} − ${b} = ${a} − ? − ${O}. What number goes in the gap?`,T,`${b} is ${t2} tens and ${O} ones. How much are the tens worth?`,`${b} = ${T} + ${O}, so ${a} − ${b} = ${a} − ${T} − ${O}.`);
  if(t===2)return num(`${a} − ${T} = ?`,mid,'Only the tens digit changes. Take the tens away from the tens.',`${a} has ${Math.floor(a/10)%10} tens. ${Math.floor(a/10)%10} tens − ${t2} tens = ${Math.floor(a/10)%10-t2} tens, so ${a} − ${T} = ${mid}.`);
  if(t===3)return num(`${a} − ${b} = ${a} − ${T} − ?. What number goes in the gap?`,O,`After the tens, what part of ${b} is still to take away?`,`${b} = ${T} + ${O}, so the ones to take away are ${O}.`);
  if(t===4)return num(`${a} − ${b} = ${a} − ${T} − ${O}. The first step gives ${mid}. What is ${mid} − ${O}?`,ans,'Now take away the ones.',pullWhy(n));
  if(t===5)return choice(`Which shows ${b} pulled apart into tens and ones?`,tchoices(`${T} and ${O}`,[`${T} and ${O}`,`${t2} and ${O}`,`${b} and 0`,`${T+10} and ${O}`]).map(o=>({label:o.label,value:o.value})),`${T} and ${O}`,`Tens first: how many tens are in ${b}? Then the ones.`,`${b} is ${t2} tens (${T}) and ${O} ones.`);
  if(t===6){
    const good=`${a} − ${T} − ${O}`,bad=[`${a} − ${T} + ${O}`,`${a} − ${b} − ${O}`,`${a} − ${T} − ${T}`];
    return choice(`Which is the Pull Apart way to work out ${a} − ${b}?`,shuffle([good,...bad]).map(v=>({label:v,value:v})),good,'Pull apart the second number, then take away both parts.',`${b} pulled apart is ${T} and ${O}, so ${a} − ${b} = ${good}.`);
  }
  const nm=pick(ACTORS),th=pick(THINGS);
  return num(`${nm} has ${a} ${th}. ${nm} gives ${b} of them to friends. How many ${th} are left?`,ans,`Pull ${b} apart into ${T} and ${O} and take them away one at a time.`,pullWhy(n));
}

/* ---------- groups and sharing ---------- */

/* ---------- fractions ---------- */
const FR={2:'½',3:'⅓',4:'¼',8:'⅛'};
function pie(n){

}

  }

  const pr=pick(pairs),big=pick([true,false]),ans=(v[pr[0]]>v[pr[1]])===big?pr[0]:pr[1];

/* ---------- money ---------- */
const fm=c=>c<100?c+'c':'$'+(c%100===0?c/100:(c/100).toFixed(2));
const COINS={5:{l:'5c',s:34,m:'s'},10:{l:'10c',s:40,m:'s'},20:{l:'20c',s:48,m:'s'},50:{l:'50c',s:56,m:'s'},100:{l:'$1',s:44,m:'g'},200:{l:'$2',s:36,m:'g'}};
const coin=v=>`<span class="coin ${COINS[v].m}" style="width:${COINS[v].s}px;height:${COINS[v].s}px">${COINS[v].l}</span>`;
const note=v=>`<span class="note n${v}">$${v}</span>`;
function gMoney(){
  const t=R(0,3);

    return choice('How much money is shown?',nchoices(total,[total+100,total-100,total+200,total-200,total+500],fm,[-500,-200,-100,100,200,500]),total,'Count the notes first, then add the dollar coins.',`${[...ns,...cs].map(x=>'$'+x).join(' + ')} = ${fm(total)}.`,`<div class="money">${ns.map(note).join('')}${cs.map(c=>coin(c*100)).join('')}</div>`);
  }

      return choice(`${cap} costs ${fm(p)}. You pay with a $1 coin. How much change do you get?`,nchoices(ans,[ans+5,ans-5,ans+10,ans-10],fm,[-20,-10,-5,5,10,20]),ans,'Count on from the price up to $1.',`${fm(p)} + ${fm(ans)} = $1, so your change is ${fm(ans)}.`);

  }

}

function gData(){
  const sets=[['Favourite fruit',['Mango','Banana','Apple','Mandarin']],['Pets at home',['Dog','Cat','Fish','Bird']],['Favourite sport',['Netball','Cricket','Swimming','Footy']],['How we get to school',['Walk','Bike','Bus','Car']],['Favourite bunny snack',['Carrot','Lettuce','Cookie','Apple']]];
  const [title,lab]=pick(sets),c=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4);
  const vis=`<div class="pg"><p class="pgt">${title}. Each dot is 1 child.</p>`+lab.map((l,i)=>`<div class="prow"><span class="pl">${l}</span><span class="dots">${dots(c[i],DOTC[i])}</span></div>`).join('')+'</div>';
  const t=R(0,4),mx=c.indexOf(Math.max(...c)),mn=c.indexOf(Math.min(...c));
  if(t===0){const i=R(0,3);return num(`How many children chose ${lab[i]}?`,c[i],'Count the dots in that row.',`There are ${c[i]} dots in the ${lab[i]} row.`,{vis})}
  if(t===1)return choice('Which one did the most children choose?',lab.map(l=>({label:l,value:l})),lab[mx],'Find the longest row of dots.',`${lab[mx]} has the most dots (${c[mx]}).`,vis);
  if(t===2)return choice('Which one did the fewest children choose?',lab.map(l=>({label:l,value:l})),lab[mn],'Find the shortest row of dots.',`${lab[mn]} has the fewest dots (${c[mn]}).`,vis);
  if(t===3){
    let i=R(0,3),j=R(0,3);while(i===j)j=R(0,3);if(c[i]<c[j])[i,j]=[j,i];
    return num(`How many more children chose ${lab[i]} than ${lab[j]}?`,c[i]-c[j],'Take the smaller number of dots away from the bigger number.',`${c[i]} − ${c[j]} = ${c[i]-c[j]}.`,{vis});
  }
  const tot=c.reduce((a,b)=>a+b,0);
  return num('How many children answered altogether?',tot,'Add the dots in every row.',`${c.join(' + ')} = ${tot}.`,{vis});
}

/* ---------- times tables, 1 to 12 ---------- */
const TRICKS={1:'Anything times 1 stays the same.',2:'Doubles! 2 × 6 is double 6.',3:'Double it, then add one more group. Or count by 3s.',4:'Double it, then double it again.',5:'Answers end in 0 or 5. It is half of the 10 times fact!',6:'Do the 5 times fact, then add one more group of 6.',7:'Skip count by 7s. Remember 7 × 7 = 49.',8:'Double, double, double! For 8 × 4: 4, 8, 16, 32.',9:'Do the 10 times fact, then take away one group. The digits of the answer add up to 9.',10:'Put a zero on the end.',11:'For 1 to 9, say the digit twice: 11 × 4 = 44.',12:'Do the 10 times fact, then add the 2 times fact: 12 × 7 = 70 + 14.'};
const factKey=(a,b)=>a<b?`${a}x${b}`:`${b}x${a}`;
/* spaced review: a fact answered right moves up a box and comes back after 1, 2, 4, 8 then 16 days. A miss sends it back to box 0, due today. */
const INTERVALS=[0,1,2,4,8,16];
const isDue=f=>f.due!=null?f.due<=dayIdx():f.w>f.r;
const dueFacts=()=>Object.entries(SAVE.facts).filter(([,f])=>isDue(f)).sort((a,b)=>(a[1].due??0)-(b[1].due??0)).map(e=>e[0]);
function recordFact(key,ok,hinted){
  const f=SAVE.facts[key]||(SAVE.facts[key]={r:0,w:0});
  if(ok){f.r++;if(!hinted)f.box=Math.min(5,(f.box||0)+1)}else{f.w++;f.box=0}
  f.due=dayIdx()+(ok&&hinted?1:INTERVALS[f.box||0]);
}
function pickFact(n){
  const ks=[...Array(12)].map((_,i)=>i+1);
  const w=ks.map(k=>{const f=SAVE.facts[factKey(n,k)]||{r:0,w:0};return Math.max(.4,1+2*f.w-.4*f.r)*(isDue(f)&&(f.r||f.w)?2:1)});
  let t=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<12;i++){t-=w[i];if(t<=0)return ks[i]}
  return 12;
}
function gTT(n,forceK){
  const k=forceK||pickFact(n),p=n*k,t=R(0,9),fact=factKey(n,k);NEXTPIC=arrayVis(n,k);
  const why=`${n} × ${k} = ${p}. Counting by ${n}s: ${[...Array(k)].map((_,i)=>n*(i+1)).join(', ')}.`;
  let q;
  if(t<=5){const a=R(0,1)?n:k,b=a===n?k:n;q=num(`${a} × ${b} = ?`,p,TRICKS[n],why)}
  else if(t===6)q=num(`${n} × ? = ${p}`,k,`How many groups of ${n} make ${p}?`,why);
  else if(t===7)q=num(`? × ${k} = ${p}`,n,`Think of the ${k} times table.`,why);
  else if(t===8)q=num(`${p} ÷ ${n} = ?`,k,`Division undoes multiplication. Think: ${n} × ? = ${p}.`,`${p} ÷ ${n} = ${k} because ${n} × ${k} = ${p}.`);
  else{
    const cand=[p-3,p-2,p-1,p+1,p+2,p+3].filter(x=>x>0&&x%n!==0);
    if(n===1||cand.length<3)q=num(`${n} × ${k} = ?`,p,TRICKS[n],why);
    else q=choice(`Which number is in the ${n} times table?`,shuffle([p,...shuffle(cand).slice(0,3)]).map(v=>({label:v,value:v})),p,`Skip count by ${n}s.`,why);
  }
  q.fact=fact;q.tt=n;q.mk=()=>gTT(n,k);return q;
}

  if(t===0)return num(`${p} ÷ ${a} = ?`,b,`Think: ${a} × ? = ${p}.`,`${p} ÷ ${a} = ${b} because ${a} × ${b} = ${p}.`);
  if(t===1)return num(`${n} shares ${p} ${th} equally among ${a} friends. How many does each friend get?`,b,`Think of the ${a} times table.`,`${a} × ${b} = ${p}, so each friend gets ${b}.`);
  if(t===2)return num(`${p} ÷ ? = ${b}`,a,`Think: ? × ${b} = ${p}.`,`${a} × ${b} = ${p}, so ${p} ÷ ${a} = ${b}.`);
  const right=`${p} ÷ ${a} = ${b}`;
  return choice(`Which one is in the same fact family as ${a} × ${b} = ${p}?`,tchoices(right,[`${a} + ${b} = ${a+b}`,`${p} − ${a} = ${p-a}`,`${b} ÷ ${a} = ${p}`]),right,'A fact family uses the same three numbers.',`${a} × ${b} = ${p} and ${p} ÷ ${a} = ${b} use the same three numbers.`);
}
const partWhy=(a,b,op)=>{
  const parts=[Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(x=>x);
  let run=a,s=[];parts.forEach(x=>{const nx=op==='+'?run+x:run-x;s.push(`${run} ${op==='+'?'+':'−'} ${x} = ${nx}`);run=nx});
  return s.join(', then ')+'.';
};
function gBig(){
  const t=R(0,6);
  if(t===0){const a=R(1,9),b=R(0,9),c=R(0,9),d=R(0,9),n=a*1000+b*100+c*10+d;return num(`What number is ${a} thousands, ${b} hundreds, ${c} tens and ${d} ones?`,n,'Say the thousands first, then hundreds, tens and ones.',`${a*1000} + ${b*100} + ${c*10} + ${d} = ${n}.`)}

  if(t===2){const a=R(300,999),b=R(110,a-60);return num(`${a} − ${b} = ?`,a-b,'Take away the hundreds, then the tens, then the ones.',partWhy(a,b,'-'))}
  if(t===3){let n=R(11,998);if(n%10===0)n++;const o=n%10,f=n-o,ans=Math.round(n/10)*10;return num(`Round ${n} to the nearest 10.`,ans,'Look at the ones digit. 5 or more rounds up.',`${n} is between ${f} and ${f+10}. The ones digit is ${o}, so round ${o>=5?'up':'down'} to ${ans}.`)}
  if(t===4){let n=R(101,949);if(n%100===0)n+=7;const h=Math.floor(n/100)*100,tt=n-h,ans=Math.round(n/100)*100;return num(`Round ${n} to the nearest 100.`,ans,'Look at the tens digit. 5 or more rounds up.',`${n} is between ${h} and ${h+100}. ${tt>=50?'It is past halfway, so round up':'It is before halfway, so round down'} to ${ans}.`)}
  if(t===5){const k=pick([['1000 more than',1000],['1000 less than',-1000]]),base=R(1200,8800);return num(`What is ${k[0]} ${base}?`,base+k[1],'Only the thousands digit changes.',`${base} ${k[1]>0?'+':'−'} 1000 = ${base+k[1]}.`)}
  const th=R(1,9),set=new Set();while(set.size<4)set.add(th*1000+R(0,999));
  const arr=[...set],big=pick([true,false]),ans=big?Math.max(...arr):Math.min(...arr);
  return choice(`Which number is the ${big?'greatest':'smallest'}?`,arr.map(v=>({label:v,value:v})),ans,'The thousands match. Compare the hundreds, then the tens.',`${ans} is the ${big?'greatest':'smallest'}.`);
}
function gTime3(){
  const h=R(1,12),m=pick([5,10,20,25,35,40,50,55]),pad=x=>String(x).padStart(2,'0'),right=`${h}:${pad(m)}`;

}

    if(!id||!(SAVE.stars>0||Object.keys(SAVE.facts).length))return;
    const k=`y2m-bk-${id}-${dayIdx()%3}`,cur=readJ(k);
    if(cur&&cur.d===dayIdx())return;
    localStorage.setItem(k,JSON.stringify({d:dayIdx(),data:SAVE}));
  }catch(e){}
}
function listBackups(id){
  const out=[];
  [0,1,2].forEach(n=>{const b=readJ(`y2m-bk-${id}-${n}`);if(b&&b.data)out.push({key:`y2m-bk-${id}-${n}`,d:b.d,stars:b.data.stars||0,facts:Object.keys(b.data.facts||{}).length})});
  const o=id==='p1'?readJ('y2m-orig'):null;if(o)out.push({key:'y2m-orig',d:null,stars:o.stars||0,facts:Object.keys(o.facts||{}).length});
  return out.sort((a,b)=>(b.d||0)-(a.d||0));
}
function exportCode(){
  const saves={};PROF.list.forEach(p=>{saves[p.id]=p.id===PROF.active?SAVE:(readJ(keyFor(p.id))||{})});
  return btoa(unescape(encodeURIComponent(JSON.stringify({app:'bunny-maths',v:1,prof:PROF,saves}))));
}
function importCode(code){
  const o=JSON.parse(decodeURIComponent(escape(atob(code.replace(/\s+/g,'')))));
  if(!o||o.app!=='bunny-maths'||!o.prof||!o.saves)throw new Error('bad');
  persist();
  Object.keys(o.saves).forEach(id=>{try{localStorage.setItem(keyFor(id),JSON.stringify(o.saves[id]))}catch(e){}});
  o.prof.list.forEach(p=>{if(!PROF.list.some(q=>q.id===p.id))PROF.list.push(p);else PROF.list.find(q=>q.id===p.id).name=p.name});
  if(!PROF.active||!PROF.list.some(p=>p.id===PROF.active))PROF.active=o.prof.active||PROF.list[0].id;
  persistProf();loadProfile(PROF.active);touchWeek();
}
autoBackup(PROF.active);

const RANKS=[[0,'Baby Bunny'],[25,'Little Hopper'],[60,'Super Hopper'],[120,'Carrot Champion'],[250,'Burrow Legend']];
function rankOf(s){
  let i=0;RANKS.forEach((r,k)=>{if(s>=r[0])i=k});
  const nx=RANKS[i+1];
  return {name:RANKS[i][1],from:RANKS[i][0],next:nx?nx[0]:null,nextName:nx?nx[1]:null};
}

function tone(f,t0,d,type='sine',g=.18,f2){
  const c=audio();if(!c)return;
  try{
    const o=c.createOscillator(),v=c.createGain(),t=c.currentTime+t0;
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}

  let a=h>>>0;const orig=Math.random;

}

  if(type==='recount')return `Write a recount about ${P(W_TOPICS)}. Tell what happened first, next, then and finally.`;
  if(type==='report')return `Write an information report about ${P(W_REPORTS)}. Tell us what it is, some facts about it, and one amazing fact.`;
  if(type==='procedure')return `Write a procedure telling someone how to ${P(W_HOWTO)}. List what you need and number the steps.`;
  if(type==='persuasive')return `${P(W_PERSUADE)} Write to persuade the reader. Give your opinion and at least two reasons.`;
  if(type==='describe'){
    const k=Math.floor(r()*3);
    if(k===0)return `Describe ${P(W_PLACES)} so well that I can picture it. Tell me what you see, hear and smell.`;
    if(k===1)return `Describe a ${P(W_ANIMALS)}. What does it look like, sound like and feel like?`;
    const a=P(W_SCENES);let b=P(W_SCENES),g=0;while(b===a&&g++<10)b=P(W_SCENES);
    return `Look at this picture: ${a} ${b}. Describe everything you can see, hear and feel in this scene.`;
  }
  if(type==='letter')return `Write a letter to ${P(W_LETTER_TO)} about ${P(W_TOPICS)}.`;
  return `Write a short poem about ${P(['a '+P(W_ANIMALS),P(W_PLACES),P(W_TOPICS),'a rainy day','the moon','my favourite colour'])}. Try to make two lines rhyme.`;
}
function newWritePrompt(type){
  let seen=[];try{seen=JSON.parse(localStorage.getItem('y2m-wseen')||'[]')}catch(e){}
  let best='',tries=0;
  while(tries++<30){const p=wPrompt(type,Math.random);best=p;if(!seen.includes(hash32(p)))break}
  seen.push(hash32(best));
  try{localStorage.setItem('y2m-wseen',JSON.stringify(seen.slice(-250)))}catch(e){}
  return best;
}
const wJoin=W=>wType(W.type).parts.map(p=>String((W.parts||{})[p.id]||'').trim()).filter(Boolean).join('\n\n');
function wChecks(W){
  const ty=wType(W.type),parts=W.parts||{},t=wJoin(W);
  const sents=t.replace(/([.!?]+["')]*)\s+/g,'$1\u0001').split('\u0001').map(s=>s.trim()).filter(Boolean);
  const words=t.split(/\s+/).filter(Boolean),lw=words.map(w=>w.toLowerCase().replace(/[^a-z']/g,''));
  const wc=id=>String(parts[id]||'').trim().split(/\s+/).filter(Boolean).length;
  const has=a=>lw.some(w=>a.includes(w)),any=re=>re.test(t);
  const startsU=new Set(sents.map(s=>(s.split(/\s+/)[0]||'').toLowerCase())).size;
  const L=[];const add=(ok,txt,tip)=>L.push({ok:!!ok,txt,tip:tip||txt});
  add(/^["'(]*[A-Z]/.test(t),'Starts with a capital letter','Begin with a capital letter.');
  add(sents.length>0&&sents.every((s,i)=>/^["'(\d]*[A-Z\d]/.test(s)||(i>0&&/[!?,]["”']$/.test(sents[i-1]))),'Every sentence starts with a capital','Check that each sentence starts with a capital letter.');
  add(/[.!?]["')]*$/.test(t),'Ends with . ? or !','Finish your last sentence with a full stop.');
  add(sents.length>=ty.sent,`At least ${ty.sent} sentences`,`Try to write ${ty.sent} sentences or more.`);
  add(words.length>=ty.min,`At least ${ty.min} words`,`Keep going. Aim for ${ty.min} words.`);
  add(has(W_ADJ),'Uses a describing word','Add a describing word, like fluffy, tiny or sparkly.');
  add(has(W_JOIN),'Uses a joining word (and, but, because)','Join two ideas with and, but or because.');
  add(sents.length<3||startsU>=Math.min(3,sents.length-1),'Sentences start in different ways','Try not to start every sentence with the same word.');
  add(!/(^|\s)i(\s|$|[,.!?'])/.test(t),'The word "I" is a capital letter','The word I is always a capital letter.');
  const partsOk=ty.parts.every(p=>wc(p.id)>=Math.min(p.min,8));
  if(ty.parts.length>1)add(partsOk,'Every part is written ('+ty.parts.map(p=>p.label).join(', ')+')','Write something in every box: '+ty.parts.filter(p=>wc(p.id)<Math.min(p.min,8)).map(p=>p.label).join(', ')+'.');
  if(ty.id==='narrative'){
    const nm=String((W.plan||{}).char||'').trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,'');
    add(!nm||String(parts.a||'').toLowerCase().includes(nm),'The beginning names your main character','Name your main character in the beginning.');
    add(has(['suddenly','but','oh','however','oops','unfortunately'])||/\b(lost|stuck|scared|trouble|problem|strange|noise)\b/i.test(String(parts.b||'')),'There is a problem to solve','Show the problem clearly. Try starting with "Suddenly,".');
    add(has(['finally','eventually','so','then','solved','fixed','found','helped','together']),'The problem gets solved','Show how the problem is solved.');
    add(has(W_FEELINGS),'Says how someone felt','Say how your character felt at the end: happy, proud, relieved ...');
    add(any(/["“”]/),'Has speech in quotation marks (bonus)','Try adding what a character says in speech marks: "Help!" cried Poppy.');
    add(has(W_TIME),'Uses time words (suddenly, then, finally)','Use time words like suddenly, then, next, finally.');
  }else if(ty.id==='recount'){
    add(has(['first','next','then','after','finally','later']),'Events are in order (first, next, then)','Put your events in order with first, next, then, finally.');
    add(has(W_FEELINGS)||any(/\bI (felt|thought|loved|liked|enjoyed)\b/),'Says how you felt','Tell how you felt at the end.');
    add(any(/\b(yesterday|today|last|on monday|on tuesday|on wednesday|on thursday|on friday|on saturday|on sunday|this morning|one day)\b/i),'Says when it happened','Say when it happened: last Saturday, yesterday ...');
  }else if(ty.id==='report'){
    add(any(/\b(is|are) (a|an|the)?\b/i),'Starts by saying what it is','Begin by saying what it is: "A koala is a ..."');
    add(any(/\b(live|lives|eat|eats|found|called|can|have|has)\b/i),'Includes real facts (lives, eats, has)','Add facts: where it lives, what it eats, what it has.');
  }else if(ty.id==='procedure'){
    add(any(/(^|\n)\s*(1|one)[.):]/i)||has(['first','next','then','finally']),'Steps are numbered or in order','Number your steps: 1. 2. 3.');
    add(any(/you (will )?need|materials|ingredients|equipment|things you need/i),'Lists what you need','Say what you need: "You will need ..."');
  }else if(ty.id==='persuasive'){
    add(any(/\bI (think|believe|feel)\b|\bshould\b|\bmust\b/i),'States an opinion (I think, should)','Say what you think: "I think we should ..."');
    add(has(['because','also','another','reason']),'Gives reasons (because, another reason)','Give reasons with because and another reason.');
    add(any(/\b(that is why|so we|therefore|in conclusion|finally|that is the reason)\b/i),'Ends strongly (that is why, so we should)','Finish strongly: "That is why we should ..."');
  }else if(ty.id==='letter'){
    add(any(/^dear\b/i),'Starts with Dear','Begin with "Dear ..."');
    add(any(/\b(from|love|yours|regards)\b/i),'Has a sign-off (From, Love)','Finish with From, Love or Yours and your name.');
  }
  return {words:words.length,sents:sents.length,list:L};
}
const wStarsFor=c=>{const n=c.list.filter(x=>x.ok).length,r=n/c.list.length;return r>=.85?3:r>=.65?2:1};

function writeAct(b){
  const op=b.dataset.op,id=b.dataset.id;
  const W=S.w||(S.w={step:'pick',type:'',prompt:'',text:''});
  const go=()=>{render();window.scrollTo(0,0)};
  if(op==='open'){snd.tap();S.view='write';S.w={step:'pick',type:'',prompt:'',text:''};go();return}
  if(op==='type'){
    snd.tap();S.view='write';
    let d=null;try{d=JSON.parse(localStorage.getItem('y2m-wdraft')||'null')}catch(e){}
    const hasDraft=d&&d.type===id&&d.parts&&Object.values(d.parts).some(v=>String(v).trim());
    S.w={step:id==='narrative'&&!hasDraft?'plan':'write',type:id,prompt:hasDraft?d.prompt:newWritePrompt(id),plan:(hasDraft&&d.plan)||{char:'',setting:'',problem:'',solution:''},parts:hasDraft?d.parts:{},text:''};
    go();return;
  }
  if(op==='another'){snd.tap();W.prompt=newWritePrompt(W.type);W.bank=null;go();return}
  if(op==='surprise'){
    const r=Math.random,P=a=>a[Math.floor(r()*a.length)];
    const nm=P(W_NAMES);W.plan={char:`${nm} the ${P(W_ANIMALS)}`,setting:`${P(W_PLACES)} ${P(['at midnight','on a rainy morning','one sunny afternoon','just before sunrise'])}`,problem:`${nm} ${P(W_PROBLEMS)}`,solution:`${nm} ${P(W_SOLUTIONS)}`};
    snd.tap();go();return;
  }
  if(op==='startwrite'){
    document.querySelectorAll('input[data-plan]').forEach(t=>{W.plan=W.plan||{};W.plan[t.dataset.plan]=t.value});
    snd.tap();W.step='write';go();return;
  }
  if(op==='ins'){
    const ta=document.getElementById(W.focus)||document.querySelector('textarea[data-part]');if(!ta)return;
    const t=b.dataset.t,s=ta.selectionStart==null?ta.value.length:ta.selectionStart,e=ta.selectionEnd==null?s:ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+t+ta.value.slice(e);const p=s+t.length;ta.focus();try{ta.setSelectionRange(p,p)}catch(_){}
    wLive();snd.tap();return;
  }
  if(op==='read'){wLive();speakText(wJoin(W)||W.prompt);return}
  if(op==='improve'){snd.tap();W.step='write';go();return}
  if(op==='finish'){
    wLive();
    const c=wChecks(W);
    if(c.words<10){toast('Write a little more first. Try for at least 10 words!');snd.no();return}
    const stars=wStarsFor(c),q=qToday(),first=(q.c.write||0)<3;
    let reward=null;
    if(first){const car=6+stars*4;gainStars(stars,0);SAVE.coins+=car;reward={stars,carrots:car}}
    const text=wJoin(W);
    SAVE.writing=SAVE.writing||[];
    SAVE.writing.push({id:'w'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),d:todayTag(),t:W.type,p:W.prompt,x:text.slice(0,1800),n:c.words,s:stars});
    while(SAVE.writing.length>40)SAVE.writing.shift();
    bump('write');touchDay();persist();
    try{localStorage.removeItem('y2m-wdraft')}catch(e){}
    W.text=text;W.step='done';W.result=Object.assign({},c,{stars,reward});
    snd.fan();go();if(stars>=2)rain();return;
  }
  if(op==='journal'){snd.tap();W.step='journal';W.openId='';W.rmAsk='';S.view='write';go();return}
  if(op==='entry'){snd.tap();W.openId=id;W.step='journal';W.rmAsk='';go();return}
  if(op==='readentry'){const e=(SAVE.writing||[]).find(x=>x.id===id);if(e)speakText(e.x);return}
  if(op==='copy'){
    const e=(SAVE.writing||[]).find(x=>x.id===id);if(!e)return;
    try{navigator.clipboard.writeText(e.x).then(()=>toast('Copied!'),()=>toast('Could not copy'))}catch(_){toast('Could not copy')}return;
  }
  if(op==='remove'){
    if(W.rmAsk!==id){W.rmAsk=id;go();return}
    SAVE.writing=(SAVE.writing||[]).filter(x=>x.id!==id);W.openId='';W.rmAsk='';persist();go();return;
  }
}

/* ---------- Fix-it Box: tricky questions come back until they are fixed ---------- */
const hash32=s=>{let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
function oopsAdd(q){
  if(!q||q.bonus||q.fixH||(q.kind!=='num'&&q.kind!=='choice'))return;
  const vis=String(q.vis||''),pic=String(q.pic||'');
  if(vis.length>1800||pic.length>1800)return;
  const h=hash32(q.tid+'|'+q.q+'|'+vis);
  SAVE.oops=SAVE.oops||[];
  if(SAVE.oops.some(o=>o.h===h))return;
  SAVE.oops.push({h,tid:q.tid,q:{kind:q.kind,q:q.q,answer:q.answer,hint:q.hint,why:q.why,dec:!!q.dec,vis,pic,show:q.show,unit:q.unit||'',options:q.options||null}});
  while(SAVE.oops.length>30)SAVE.oops.shift();
}
function oopsFixed(h){SAVE.oops=(SAVE.oops||[]).filter(o=>o.h!==h)}
/* questions she has answered RIGHT are remembered, so the same one is not asked again for a long while.
   Questions she got wrong are never added, so they are free to come back and be practised. */
const SEEN_MAX=1200;
const qKey=q=>hash32((q.tid||'')+'|'+(q.q||'')+'|'+(q.vis||'')+'|'+(q.word||'')+'|'+(q.show||''));
function seenList(){return Array.isArray(SAVE.seen)?SAVE.seen:(SAVE.seen=[])}
function markSeen(q){
  if(!q||q.bonus||q.fixH||q.tid==='tt')return;
  const k=qKey(q),a=seenList();
  if(a.includes(k))return;
  a.push(k);if(a.length>SEEN_MAX)a.splice(0,a.length-SEEN_MAX);
}

    const u=new SpeechSynthesisUtterance(t);u.lang='en-AU';u.rate=.9;

function workAct(a,b){

function cosyPoints(){
  let p=0;const pts=(list,defs)=>(list||[]).forEach(id=>{const d=defs.find(x=>x.id===id);if(d)p+=Math.floor((d.cost||0)/3)});

function srand(seed){

  let a=h>>>0;

}

function burrow(){
  const lu=checkLevel();if(lu)S.lvUp=lu;
  let tab=S.btab;
  if(['hats','outfits'].includes(tab)){S.bsub=tab;tab='cookie'}
  else if(tab==='home'){tab='decor';S.bsub='furn'}
  else if(tab==='paint'){tab='decor';S.bsub='wall'}
  else if(tab==='build')tab='garden';
  if(!BTABS.some(t=>t[0]===tab))tab='decor';
  S.btab=tab;
  const pts=cosyPoints(),li=lvOf(pts),nx=LEVELS[li+1],pct=nx==null?100:Math.round((pts-LEVELS[li])/(nx-LEVELS[li])*100);
  const T={decor:decorTab,cookie:cookieTab,pets:petsTab,garden:gardenTab,shop:shopTab,goals:goalsTab}[tab]();
  const badge={garden:farmReady(),goals:questsReady()+achReady(),decor:visitorInfo().n&&!visitorInfo().done?1:0};
  const tabs=BTABS.map(([id,n,em])=>`<button class="gtab main${tab===id?' on':''}" data-act="btab" data-t="${id}">${em} ${n}${badge[id]?`<i class="dotb">${badge[id]>9?'9+':badge[id]}</i>`:''}</button>`).join('');
  const lvUp=S.lvUp?`<div class="rankup daily">Burrow level up! Level ${S.lvUp.l}: ${S.lvUp.name}. +${S.lvUp.gain} carrots!</div>`:'';
  const line=S.burrowLine||'Welcome to Burrow v2! Decorate, plant a garden, look after pets and finish quests.';
  $v.innerHTML=`
  <div class="qhead">${mascotBtn('cheer','big bounce',false)}${bubble(line)}</div>
  <section class="card burrowhub">
    ${lvUp}
    <div class="hubtop"><div class="lvchip"><b>Lv ${li+1}</b><span>${LVNAMES[li]}</span></div><div class="meter" role="img" aria-label="Burrow level progress"><i style="width:${Math.max(4,pct)}%"></i></div><span class="hubc">${icon('carrot')} ${SAVE.coins}</span></div>
    ${T.scene}
    <div class="gtabs mains">${tabs}</div>
    ${T.body}
  </section>`;
  if(S.lvUp){snd.fan();rain();S.lvUp=null}

/* ----- buying and equipping (rooms and daily deals aware) ----- */
function buyItem(k,id){
  const def=KDEF[k]().find(x=>x.id===id);if(!def)return;
  if(!isOwned(k,def)){
    const cost=priceOf(k,def);
    if(SAVE.coins<cost){snd.no();return}
    SAVE.coins-=cost;giveItem(k,id);
    S.burrowLine=`Yay! ${def.name}! I love it!`;snd.yes();
  }
  if(k==='pet'){persist();render();return}
  equipItem(k,id,true);
}
function equipItem(k,id,fresh){
  const rs=roomState(S.room||'main');
  if(k==='hat')SAVE.wear=id;
  else if(k==='outfit')SAVE.outfit=id;
  else if(k==='wall')rs.wallp=id;
  else if(k==='floor')rs.floorp=id;
  else{const def=ITEMS.find(x=>x.id===id);rs.use[def.slot]=rs.use[def.slot]===id&&!fresh?'':id}
  if(!fresh)snd.tap();
  const y=window.scrollY;
  persist();render();window.scrollTo(0,y);
  if(fresh)confettiAt($v.querySelector('.scene')||$v.querySelector('.stage'),30,200);
}

/* ----- every Burrow v2 button ----- */
function v2Act(b){
  const op=b.dataset.op,id=b.dataset.id,y=window.scrollY,today=todayTag();
  const done=(line,fx)=>{if(line)S.burrowLine=line;persist();render();window.scrollTo(0,y);if(fx==='conf')confettiAt($v.querySelector('.scene')||$v.querySelector('.burrowhub'),26,180);if(fx==='rain')rain()};
  if(op==='sub'){S.bsub=id;snd.tap();render();window.scrollTo(0,y);return}
  if(op==='room'){S.room=id;snd.tap();render();window.scrollTo(0,y);return}
  if(op==='buyroom'){
    const r=roomDef(id);if(burrowLevel()<r.lvl||SAVE.coins<r.cost){snd.no();return}
    SAVE.coins-=r.cost;roomsOwned().push(id);S.room=id;snd.yes();done(`A brand new ${r.name}! Let us decorate it!`,'conf');return;
  }
  if(op==='visit'){const v=visitorInfo();if(v.done||!v.n){snd.no();return}SAVE.vis=today;SAVE.coins+=v.gift;snd.yes();done(`${v.n} friends dropped by and left ${v.gift} carrots!`,'conf');return}
  if(op==='crop'){S.fcrop=id;snd.tap();render();window.scrollTo(0,y);return}
  if(op==='plant'){
    const i=+b.dataset.i,c=CROPS.find(x=>x.id===(S.fcrop||'carrot'));
    if(!c||burrowLevel()<c.lvl||plotInfo(i).st!=='empty'){snd.no();return}
    if(SAVE.coins<c.cost){snd.no();toast('You need more carrots for those seeds.');return}
    SAVE.coins-=c.cost;farmSet(i,{c:c.id,t:Date.now()});bump('plant');snd.tap();done('');return;
  }
  if(op==='harvest'||op==='harvestall'){
    let n=0,gain=0;
    for(let i=0;i<maxPlots();i++){
      if(op==='harvest'&&i!==+b.dataset.i)continue;
      const p=plotInfo(i);if(p.st!=='ready')continue;
      gain+=cropYield(p.c);n++;farmSet(i,{c:'',t:0});
    }
    if(!n){snd.no();return}
    SAVE.coins+=gain;bump('harv',n);snd.yes();done(`You harvested ${n} crop${n>1?'s':''} for ${gain} carrots!`,'conf');return;
  }
  if(op==='selpet'){S.petSel=id;snd.tap();render();window.scrollTo(0,y);return}
  if(op==='feed'){
    const t=TREATS.find(x=>x.id===b.dataset.t),p=PETS.find(x=>x.id===id),pb=pbOf(id);
    if(!t||!p)return;
    if(pb.n>=3){toast('Full tummy! Come back tomorrow.');return}
    if(SAVE.coins<t.cost){snd.no();return}
    SAVE.coins-=t.cost;pb.n++;
    const fav=favTreat(id).id===t.id,res=addBond(id,t.xp*(fav?2:1));bump('feed');snd.yes();
    done(`${p.name} loved the ${t.name.toLowerCase()}${fav?' (a favourite!)':''}!${res?` Bond level up: ${BONDN[res.lv]}! +${res.gain} carrots!`:''}`,res?'rain':'conf');return;
  }
  if(op==='play'){
    const p=PETS.find(x=>x.id===id),pb=pbOf(id);if(!p||pb.p===today){snd.no();return}
    pb.p=today;const res=addBond(id,10);bump('play');tone(p.hz,0,.12,'triangle',.2);tone(p.hz*1.26,.13,.14,'triangle',.2);
    done(`You played with ${p.name}! ${p.say}${res?` Bond level up: ${BONDN[res.lv]}! +${res.gain} carrots!`:''}`,res?'rain':'conf');return;
  }
  if(op==='box'){
    const bx=BOXES.find(x=>x.id===id);if(!bx)return;
    if(burrowLevel()<bx.lvl||SAVE.coins<bx.cost){snd.no();return}
    SAVE.coins-=bx.cost;
    const pool=catalogue().filter(e=>e.x.cost>=bx.lo&&e.x.cost<=bx.hi&&!isOwned(e.k,e.x));
    if(pool.length){const e=pick(pool);giveItem(e.k,e.x.id);S.boxRes={k:e.k,id:e.x.id,box:bx.name}}
    else{const back=Math.round(bx.cost*1.5);SAVE.coins+=back;S.boxRes={back,box:bx.name}}
    bump('box');snd.fan();done('','rain');return;
  }
  if(op==='claimq'){
    const q=qToday(),x=todaysQuests().find(z=>z.id===id);
    if(!x||q.k[id]||(q.c[x.key]||0)<x.n){snd.no();return}
    q.k[id]=1;SAVE.coins+=x.reward;snd.yes();done(`Quest done! +${x.reward} carrots!`,'conf');return;
  }
  if(op==='chest'){
    const q=qToday();if(q.k.chest||!todaysQuests().every(z=>q.k[z.id])){snd.no();return}
    q.k.chest=1;SAVE.coins+=CHEST;snd.fan();done(`You opened the daily chest: +${CHEST} carrots!`,'rain');return;
  }
  if(op==='claimach'){
    const a=ACH.find(z=>z.id===id);if(!a||achClaimed(id)||a.get()<a.need){snd.no();return}
    SAVE.ach=SAVE.ach||[];SAVE.ach.push(id);SAVE.coins+=a.reward;snd.fan();done(`${a.name}! +${a.reward} carrots!`,'rain');return;
  }
}

const PLAY_MS=300000;
const G={raf:0,timers:[],off:null};
function stopGame(){

  G.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});G.timers=[];

const gTimer=(fn,ms)=>{const t=setTimeout(fn,ms);G.timers.push(t);return t};
const hiSet=(id,s)=>{if(s>(SAVE.hi[id]||0)){SAVE.hi[id]=s;persist();return true}return false};
const CARROT='<svg viewBox="0 -8 30 74" aria-hidden="true"><path d="M15 12 Q7 0 11 -6 Q16 2 15 12Z M15 12 Q23 0 19 -6 Q14 2 15 12Z" fill="#3FA85B" stroke="#22304A" stroke-width="2" stroke-linejoin="round"/><path d="M15 64 L4 22 Q15 8 26 22Z" fill="#FF9A3C" stroke="#22304A" stroke-width="2.5" stroke-linejoin="round"/><path d="M9 30 H15 M17 40 H22 M11 48 H16" stroke="#22304A" stroke-width="2" stroke-linecap="round"/></svg>';

function gameCatch(el){
  el.innerHTML=`<div class="gscore">Carrots: <b id="gs">0</b> <span class="sub">Best: ${SAVE.hi.catch||0}</span></div><div class="arena" id="ar"><div class="gbun" id="gb">${mascot('cheer')}</div></div>`;
  const ar=el.querySelector('#ar'),gb=el.querySelector('#gb'),gs=el.querySelector('#gs');
  let W=ar.clientWidth||600,H=ar.clientHeight||400,x=W/2,score=0,items=[],last=0,spawn=.4;
  const move=e=>{const r=ar.getBoundingClientRect();x=Math.max(45,Math.min(Math.max(46,r.width-45),e.clientX-r.left))};
  ar.addEventListener('pointerdown',move);ar.addEventListener('pointermove',move);
  const loop=t=>{
    const dt=Math.min(.05,(t-(last||t))/1000);last=t;
    W=ar.clientWidth||W;H=ar.clientHeight||H;
    spawn-=dt;
    if(spawn<=0){
      const gold=Math.random()<.12,d=document.createElement('div'),ix=R(30,Math.max(31,W-30));
      d.className='fall'+(gold?' gold':'');d.innerHTML=CARROT;d.style.left=ix+'px';ar.appendChild(d);
      items.push({d,x:ix,y:-70,gold,v:150+Math.min(220,score*4)+R(0,60)});
      spawn=Math.max(.35,.9-score*.012);
    }
    items=items.filter(it=>{
      it.y+=it.v*dt;it.d.style.transform=`translateY(${it.y}px)`;
      if(it.y>H-120&&it.y<H-30&&Math.abs(it.x-x)<58){score+=it.gold?5:1;gs.textContent=score;snd.tap();if(it.gold)tone(988,0,.2,'triangle',.2);it.d.remove();return false}
      if(it.y>H+20){it.d.remove();return false}
      return true;
    });
    gb.style.transform=`translateX(${x-45}px)`;
    G.raf=requestAnimationFrame(loop);
  };
  G.raf=requestAnimationFrame(loop);
  G.off=()=>{hiSet('catch',score)};
}

function gameMatch(el){
  const ids=shuffle(STICKERS.map((_,i)=>i)).slice(0,6);
  const cards=shuffle([...ids,...ids]).map((id,k)=>({id,k,up:false,done:false}));
  let first=null,lock=false,moves=0,found=0;
  const draw=()=>{
    el.innerHTML=`<div class="gscore">Moves: <b>${moves}</b> <span class="sub">Best: ${SAVE.hi.matchBest||'none yet'}</span></div><div class="mgrid">${cards.map(c=>{const s=c.up||c.done;return `<button class="mcard${s?' up':''}${c.done?' done':''}" data-k="${c.k}" aria-label="${s?STICKERS[c.id].name:'Hidden card'}">${s?`<span class="mf">${creature(c.id)}</span>`:'<span class="mb">?</span>'}</button>`}).join('')}</div>${found===6?`<div class="gover"><h3>You did it in ${moves} moves!</h3><button class="btn" data-g="again">Play again</button></div>`:''}`;
  };
  el.onclick=e=>{
    if(e.target.closest('[data-g=again]')){gameMatch(el);return}
    const b=e.target.closest('.mcard');if(!b||lock)return;
    const c=cards[+b.dataset.k];if(c.up||c.done)return;
    c.up=true;snd.tap();
    if(first===null){first=c;draw();return}
    moves++;
    if(first.id===c.id){
      first.done=c.done=true;first.up=c.up=false;found++;first=null;
      tone(784,0,.15,'triangle',.2);tone(1047,.12,.2,'triangle',.2);
      if(found===6&&(!SAVE.hi.matchBest||moves<SAVE.hi.matchBest)){SAVE.hi.matchBest=moves;persist()}
      draw();
      if(found===6){snd.fan();confettiAt(el,40,260)}
    }else{const a=first;first=null;lock=true;draw();gTimer(()=>{a.up=false;c.up=false;lock=false;draw()},800)}
  };
  draw();
  G.off=()=>{el.onclick=null};
}

function gamePop(el){

function gameHop(el){
  el.innerHTML=`<div class="gscore">Score: <b id="gs">0</b> <span class="sub">Best: ${SAVE.hi.hop||0}</span></div><div class="arena hop" id="ar"><div class="ground"></div><div class="hb" id="hb">${mascot('happy')}</div></div><div class="gover" id="go" hidden><h3 id="gt"></h3><button class="btn" data-g="again">Hop again</button></div>`;
  const ar=el.querySelector('#ar'),hb=el.querySelector('#hb'),gs=el.querySelector('#gs'),go=el.querySelector('#go'),gt=el.querySelector('#gt');

  const loop=t=>{
    const dt=Math.min(.05,(t-(last||t))/1000);last=t;
    vy-=2000*dt;y=Math.max(0,y+vy*dt);if(y===0&&vy<0)vy=0;

function gameDash(el){
  el.innerHTML=`<div class="gscore">Score: <b id="gs">0</b> <span class="hearts" id="hr" aria-label="Lives">♥♥♥</span> <span class="sub">Best: ${SAVE.hi.dash||0}</span></div>
  <div class="dash"><h3 class="dq" id="dq"></h3><div class="dopts" id="do"></div><div class="dbar"><i id="dt"></i></div></div>
  <div class="gover" id="go" hidden><h3 id="gt"></h3><button class="btn" data-g="again">Dash again</button></div>`;
  const dq=el.querySelector('#dq'),dopts=el.querySelector('#do'),dt=el.querySelector('#dt'),gs=el.querySelector('#gs'),hr=el.querySelector('#hr'),go=el.querySelector('#go'),gt=el.querySelector('#gt');
  let score=0,lives=3,q=null,start=0,limit=7000,lock=false,over=false;
  const hearts=()=>{hr.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)};
  const finish=()=>{
    over=true;const nb=hiSet('dash',score),c=Math.floor(score/4);if(c){SAVE.coins+=c;persist()}
    gt.textContent=(nb?'New best: ':'You scored ')+score+(c?`! +${c} carrots`:'!');go.hidden=false;dopts.innerHTML='';snd.fan();
  };
  const loseLife=()=>{lives--;hearts();if(lives<=0)finish();else gTimer(nextQ,900)};
  const nextQ=()=>{
    if(over)return;lock=false;
    const n=R(2,12),k=pickFact(n),p=n*k,a=R(0,1)?n:k,b=a===n?k:n;
    const ds=[...new Set([(a+1)*b,(a-1)*b,a*(b+1),a*(b-1),p+n,p-n,p+1,p-1].filter(x=>x>0&&x!==p))];
    const opts=[p,...shuffle(ds).slice(0,3)];let x=p+2;while(opts.length<4){if(!opts.includes(x))opts.push(x);x++}
    q={a,b,p,fact:factKey(n,k)};dq.textContent=`${a} × ${b} = ?`;
    dopts.innerHTML=shuffle(opts).map(v=>`<button class="dopt" data-v="${v}"><span class="dc">${CARROT}</span><b>${v}</b></button>`).join('');
    start=Date.now();limit=Math.max(4000,7000-score*120);
  };
  dopts.onclick=e=>{
    const b=e.target.closest('.dopt');if(!b||lock||over)return;lock=true;
    const v=+b.dataset.v,ok=v===q.p;recordFact(q.fact,ok,false);persist();
    if(ok){score++;gs.textContent=score;snd.tap();tone(880,0,.1,'triangle',.15);b.classList.add('right');gTimer(nextQ,350)}
    else{b.classList.add('wrong');const r=dopts.querySelector(`[data-v="${q.p}"]`);if(r)r.classList.add('right');snd.no();loseLife()}
  };
  el.onclick=e=>{if(e.target.closest('[data-g=again]'))gameDash(el)};
  const iv=setInterval(()=>{
    if(over||lock||!q)return;
    const f=Math.max(0,1-(Date.now()-start)/limit);dt.style.width=Math.round(f*100)+'%';
    if(f<=0){lock=true;const r=dopts.querySelector(`[data-v="${q.p}"]`);if(r)r.classList.add('right');snd.no();loseLife()}
  },100);
  G.timers.push(iv);
  hearts();nextQ();
  G.off=()=>{if(!over)hiSet('dash',score);el.onclick=null;dopts.onclick=null};
}

function paintStroke(ctx,st,w,h){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  if(st.t==='dot'){
    ctx.fillStyle=st.c;ctx.strokeStyle='#22304A';ctx.lineWidth=2;
    st.p.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x*w,y*h,9,0,Math.PI*2);ctx.fill();ctx.stroke()});
  }else{
    ctx.globalCompositeOperation=st.t==='erase'?'destination-out':'source-over';
    ctx.strokeStyle=st.c;ctx.lineWidth=st.t==='erase'?44:6;
    ctx.beginPath();
    st.p.forEach(([x,y],i)=>i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h));
    if(st.p.length===1)ctx.lineTo(st.p[0][0]*w+.1,st.p[0][1]*h);
    ctx.stroke();
  }
  ctx.restore();
}
let PADDRAW=null;
function initPad(){
  const cv=document.getElementById('cv');if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');if(!ctx)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),cw=cv.clientWidth||600,ch=cv.clientHeight||260;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const draw=()=>{ctx.clearRect(0,0,cw,ch);S.strokes.forEach(st=>paintStroke(ctx,st,cw,ch))};PADDRAW=draw;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/(r.width||1),(e.clientY-r.top)/(r.height||1)]};
  let cur=null;
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(S.tool==='dot'){S.strokes.push({t:'dot',c:S.col,p:[pt(e)]});snd.tap();draw();return}
    cur={t:S.tool==='erase'?'erase':'pen',c:S.col,p:[pt(e)]};S.strokes.push(cur);draw();
  });
  cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();cur.p.push(pt(e));draw()});
  const end=()=>{cur=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
}

/* ---------- save and print that work on iPad ---------- */
async function saveFile(data,filename,mime,msgId){
  const say=t=>{const m=document.getElementById(msgId);if(m)m.textContent=t};
  try{
    if(window.claude&&claude.use){
      const d=await claude.use('downloads');
      if(d){
        try{await d.save({filename,data});say('Saved! Look in the Files app, in Downloads. To print it, open it and tap Share, then Print.');return}
        catch(e){if(e&&e.code==='declined'){say('No problem. Nothing was saved.');return}}
      }
    }
  }catch(e){}
  try{
    const f=new File([data],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});say('Choose Save to Files, or Print, from the share sheet.');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const url=URL.createObjectURL(new Blob([data],{type:mime}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    say('If a download did not start, use the Copy button and paste into Notes or Mail.');
  }catch(e){say('Saving is not available here. Use the Copy button and paste into Notes or Mail.')}
}
function standaloneDoc(title,sel){
  const el=document.querySelector(sel);if(!el)return '';
  const c=el.cloneNode(true);c.querySelectorAll('.noprint').forEach(n=>n.remove());
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${css}</style><style>body{background:#fff!important;padding:12px!important}.card{box-shadow:none!important}.pgtip{font:16px system-ui;background:#FFF0B3;padding:8px 12px;border-radius:10px;margin-bottom:12px}@media print{.pgtip{display:none}}</style></head><body><p class="pgtip">To print: tap Share, then Print.</p>${c.outerHTML}</body></html>`;
}
function copyText(text,msgId,ok){
  const say=t=>{const m=document.getElementById(msgId);if(m)m.textContent=t};
  const fall=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,999999);const r=document.execCommand('copy');ta.remove();say(r?ok:'Could not copy here. Try the Save button.')}catch(e){say('Could not copy here. Try the Save button.')}};
  try{navigator.clipboard.writeText(text).then(()=>say(ok),fall)}catch(e){fall()}
}
const todayTag=()=>dayStr(new Date());
function doPrint(msgId,txt){
  try{window.print()}catch(e){}
  setTimeout(()=>{const m=document.getElementById(msgId);if(m)m.textContent=txt},700);
}
function saveAct(a){
  if(a==='savews'){const w=S.ws;saveFile(standaloneDoc((w&&w.title)||'Worksheet','section.card.ws'),`worksheet-${todayTag()}.html`,'text/html','wsmsg')}
  else if(a==='copyws'){const el=document.querySelector('section.card.ws');const c=el.cloneNode(true);c.querySelectorAll('.noprint').forEach(n=>n.remove());copyText(c.innerText||c.textContent,'wsmsg','Copied! Paste it into Notes, Pages or Mail to print.')}
  else if(a==='savecert')saveFile(standaloneDoc('Certificate','section.card.cert'),`certificate-${todayTag()}.html`,'text/html','certmsg');
  else if(a==='saverep'){SAVE.lastBackup=dayIdx();persist();saveFile(reportText(),`progress-${todayTag()}.txt`,'text/plain','repmsg')}
  else if(a==='savebk'){SAVE.lastBackup=dayIdx();persist();saveFile(exportCode(),`cookie-backup-${todayTag()}.txt`,'text/plain','bkmsg')}
  else if(a==='printws')doPrint('wsmsg','If the print window did not open, tap Save worksheet. Open the saved file, then tap Share and Print. Or tap Copy as text and paste it into Notes.');
  else if(a==='printcert')doPrint('certmsg','If the print window did not open, tap Save certificate. Open the saved file, then tap Share and Print.');
  else if(a==='printrep')doPrint('repmsg','If the print window did not open, tap Save summary and open the saved file.');
  else return false;
  return true;
}

const PET_X=[[16,178,1.15],[72,178,1.15],[262,178,1.15],[322,176,1.1],[190,204,.95]];
function petSvgIn(p){return `<g stroke="#22304A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${p.svg}</g>`}
function petsSvg(live){
  return (SAVE.petOut||[]).slice(0,maxPets()).map((id,i)=>{
    const p=PETS.find(x=>x.id===id);if(!p)return '';
    const px=PET_X[i]||PET_X[0],g=`<g transform="translate(${px[0]},${px[1]}) scale(${px[2]})">${petSvgIn(p)}</g>`;
    return live?`<g class="petg" data-act="petpat" data-id="${id}" role="button" aria-label="Pat ${esc(p.name)}" style="cursor:pointer">${g}</g>`:g;
  }).join('');
}
function petCards(){
  return PETS.map(p=>{
    const own=(SAVE.pets||[]).includes(p.id),out=(SAVE.petOut||[]).includes(p.id);
    const btn=own?`<button class="btn small${out?' alt':''}" data-act="petout" data-id="${p.id}">${out?'Let it rest':'Bring out'}</button>`:`<button class="btn small sun" data-act="petbuy" data-id="${p.id}"${SAVE.coins<p.cost?' disabled':''}>${icon('carrot')}<span>${p.cost}</span></button>`;
    return `<div class="shopc${out?' on':''}"><div class="sprev wide"><svg viewBox="0 0 60 50" class="ithumb" aria-hidden="true">${petSvgIn(p)}</svg></div><b>${p.name}</b>${btn}</div>`;
  }).join('')+`<p class="sub petnote">Up to ${maxPets()} pets can play in the burrow at once. Build the Pet Treehouse in Garden upgrades for more room. Tap a pet to pat it. Pat each pet once a day to get a free carrot!</p>`;
}
function petAct(a,b){
  const id=b.dataset.id,p=PETS.find(x=>x.id===id);if(!p)return;
  SAVE.pets=SAVE.pets||[];SAVE.petOut=SAVE.petOut||[];
  const y=window.scrollY;
  if(a==='petbuy'){
    if(SAVE.pets.includes(id))return;
    if(SAVE.coins<priceOf('pet',p)){snd.no();return}
    SAVE.coins-=priceOf('pet',p);SAVE.pets.push(id);
    while(SAVE.petOut.length>=maxPets())SAVE.petOut.shift();SAVE.petOut.push(id);
    S.burrowLine=`${p.name} has come to live with me! ${p.say}`;snd.yes();persist();render();window.scrollTo(0,y);confettiAt($v.querySelector('.scene'),30,200);
  }else if(a==='petout'){
    const k=SAVE.petOut.indexOf(id);
    if(k>=0)SAVE.petOut.splice(k,1);else{while(SAVE.petOut.length>=maxPets())SAVE.petOut.shift();SAVE.petOut.push(id)}
    snd.tap();persist();render();window.scrollTo(0,y);
  }else{
    const d=todayTag();if(!SAVE.petDay||SAVE.petDay.d!==d)SAVE.petDay={d,ids:[]};
    let line=`${p.name} says: ${p.say}`;
    if(!SAVE.petDay.ids.includes(id)){SAVE.petDay.ids.push(id);SAVE.coins+=1;addBond(id,2);bump('play');line+=' You got 1 carrot for looking after me!'}
    S.burrowLine=line;tone(p.hz,0,.12,'triangle',.2);tone(p.hz*1.26,.13,.14,'triangle',.2);persist();render();window.scrollTo(0,y);
    confettiAt($v.querySelector('.scene'),12,120);
  }
}
